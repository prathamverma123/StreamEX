# ─────────────────────────────────────────────────────────────────────────────
# StreamEX — nginx reverse proxy
#
# Serves:
#   /            → API (Express, :4000)
#   /hls/        → HLS segments/playlists from the shared storage volume with
#                  range-request support + immutable caching (content-addressed
#                  keys, safe to cache forever)
#
# CORS is applied on the API because the browser hits nginx, not Express
# directly, and the preflight response must carry the same headers.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type   application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush   on;
    tcp_nodelay  on;
    server_tokens off;

    # HLS segments are small; keep the buffer modest.
    client_body_buffer_size 128k;
    client_max_body_size 512m;   # chunked uploads

    # gzip for JSON/HTML; brotli needs the module — enabled only if present.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/vnd.apple.mpegurl
        text/css
        text/plain
        text/vtt
        application/vnd.apple.mpegurl;

    # (If nginx is built with brotli: brotli on; brotli_types as above.)

    # ── request-ID propagation to the API ──────────────────────────────────
    map $http_x_request_id $reqid {
        default $http_x_request_id;
        ""      $request_id;
    }

    # ── CORS: single shared origin list ─────────────────────────────────────
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
    }

    upstream api {
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Propagate client IP for rate limiting / logging.
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $reqid;

        # ── CORS (API) ────────────────────────────────────────────────────
        # Only allowed origins echo back; everything else is dropped.
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Profile-Id, X-Request-Id, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── API ─────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;

            # Chunked upload endpoints stream bodies through.
            proxy_request_buffering off;
        }

        # ── HLS: segments + playlists from the shared volume ───────────────
        location /hls/ {
            alias /data/storage/hls/;

            # Content-addressed keys → cache forever, and permit zero-revalidation.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin $cors_origin always;

            # The API signs the token in the URL path; nginx adds nothing.
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
                text/vtt                      vtt;
                image/jpeg                    jpg;
            }

            # Range requests for scrubbing previews.
            add_header Accept-Ranges bytes always;
        }
    }
}
